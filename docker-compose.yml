services:
  database_ts:
    image: mysql:5.7
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --init-file /docker-entrypoint-initdb.d/init.sql
    ports:
      - "3312:3306"
    environment:
      - MYSQL_DATABASE=database_ts
      - MYSQL_ROOT_USER=juanito
      - MYSQL_USER=juanjose
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_PASSWORD=secret
